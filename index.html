<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>0 to Shipped Resume Parser</title>
    <style>
        /* --- CSS STYLES --- */
        :root {
            --primary-color: #007bff;
            --success-color: #28a745;
            --danger-color: #dc3545;
            --bg-light: #f8f9fa;
            --text-dark: #343a40;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-light);
            color: var(--text-dark);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            max-width: 900px;
            width: 100%;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        header h1 {
            color: var(--primary-color);
            font-size: 2.5em;
            margin-bottom: 5px;
        }

        header p {
            color: #6c757d;
        }

        .upload-section {
            border: 2px dashed #ccc;
            padding: 40px;
            text-align: center;
            border-radius: 8px;
            margin-bottom: 30px;
            transition: border-color 0.3s, background-color 0.3s;
        }

        .upload-section:hover {
            border-color: var(--primary-color);
            background-color: #e9f5ff;
        }

        #pdfFile {
            display: none; /* Hide the actual file input */
        }

        .custom-file-upload {
            cursor: pointer;
            background-color: var(--primary-color);
            color: white;
            padding: 10px 25px;
            border-radius: 5px;
            display: inline-block;
            transition: background-color 0.3s;
        }

        .custom-file-upload:hover {
            background-color: #0056b3;
        }

        .file-info {
            margin-top: 15px;
            font-style: italic;
            color: #6c757d;
        }

        /* Results Section */
        .results-section {
            display: flex;
            gap: 20px;
            margin-top: 30px;
        }

        .card {
            flex: 1;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
            border-left: 5px solid;
        }

        .score-card {
            border-left-color: var(--primary-color);
            background-color: #e7f3ff;
        }

        .skills-card {
            border-left-color: var(--success-color);
            background-color: #e6ffe9;
        }

        .missing-card {
            border-left-color: var(--danger-color);
            background-color: #ffe6e9;
        }

        .card h3 {
            margin-top: 0;
            font-size: 1.2em;
            border-bottom: 1px solid #eee;
            padding-bottom: 10px;
        }

        .score-display {
            font-size: 3em;
            font-weight: bold;
            color: var(--primary-color);
            display: block;
            margin: 10px 0;
        }

        .skill-list {
            list-style: none;
            padding: 0;
        }

        .skill-list li {
            background: #f1f1f1;
            padding: 8px 12px;
            border-radius: 4px;
            margin-bottom: 5px;
            display: inline-block;
            margin-right: 8px;
            font-size: 0.9em;
        }

        /* Utility for loading state */
        .loader {
            text-align: center;
            padding: 20px;
            display: none; /* Hidden by default */
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>🚀 0 to Shipped Resume Parser</h1>
            <p>Upload a PDF to instantly analyze your skills and score.</p>
        </header>

        <!-- UPLOAD SECTION -->
        <div class="upload-section">
            <label for="pdfFile" class="custom-file-upload">
                📂 Select PDF Resume
            </label>
            <input type="file" id="pdfFile" accept=".pdf">
            <p class="file-info" id="fileNameDisplay">No file selected.</p>
        </div>

        <!-- LOADING INDICATOR -->
        <div class="loader" id="loader">
            <div class="spinner"></div>
            <p>Analyzing resume... This simulates the backend parsing process.</p>
